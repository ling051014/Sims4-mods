name: Convert genealogy portraits to separate PNGs
on:
  push:
    branches: [genealogy-structural-optimization-20260926]
    paths: [.github/workflows/convert-genealogy-png.yml]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original PNG bytes and update integrity tests
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path
          root=Path('L1nG/GenealogyExporter')
          source=root/'genealogy_sample_portraits.js'
          text=source.read_text(encoding='utf-8')
          match=re.search(r'global\.L1nGGenealogySamplePortraits\s*=\s*Object\.assign\(\{\},\s*(.*?)\s*\);',text,re.S)
          assert match, 'Unexpected embedded portrait format'
          chunks=json.loads('['+match.group(1)+']')
          assert len(chunks)==6
          all_images={}
          for obj in chunks:
              assert isinstance(obj,dict)
              for key,value in obj.items():
                  assert key not in all_images,key
                  all_images[key]=value
          assert len(all_images)==30, len(all_images)
          outdir=root/'assets'/'sample-portraits'
          old_files=list(outdir.glob('*.png'))
          assert len(old_files)==30, len(old_files)
          def check_png(data,relative):
              size=128 if relative.endswith('/shared_unknown.png') else 512
              assert data[:8]==bytes.fromhex('89504e470d0a1a0a')
              assert data[12:16]==b'IHDR'
              assert int.from_bytes(data[16:20],'big')==size
              assert int.from_bytes(data[20:24],'big')==size
              assert data[24:26]==bytes([8,6])
          for key,payload in all_images.items():
              assert key.startswith('assets/sample-portraits/') and key.endswith('.png'),key
              destination=root/key
              assert not destination.exists(),f'Would overwrite existing PNG: {key}'
              binary=base64.b64decode(payload,validate=True)
              check_png(binary,key)
              destination.write_bytes(binary)
              assert hashlib.sha256(destination.read_bytes()).digest()==hashlib.sha256(binary).digest()
          assert len(list(outdir.glob('*.png')))==60
          source.write_text("/* 預設肖像皆為獨立 PNG；保留全域空物件以維持既有載入流程。 */\n(function(global){'use strict';global.L1nGGenealogySamplePortraits={};})(window);\n",encoding='utf-8')
          testfile=Path('tests/default_portrait_integrity.test.cjs')
          test=testfile.read_text(encoding='utf-8')
          start=test.index('  const embedded = [], published = [];')
          end=test.index("\n});",start)
          replacement="""  assert.equal(Object.keys(images).length, 0, '內嵌 PNG 必須清空');
          const portraitDir = path.join(ROOT, 'assets/sample-portraits');
          assert.equal(fs.readdirSync(portraitDir).filter(name => name.endsWith('.png')).length, 60);
          for (const id of targets) {
            const name = id + '.png';
            inspectPng(fs.readFileSync(path.join(portraitDir, name)), name, 512);
          }
          inspectPng(fs.readFileSync(path.join(portraitDir, 'shared_unknown.png')), 'shared_unknown.png', 128);
          assert.ok(!Object.keys(images).some(name => name.endsWith('.webp')), '禁止舊版 192px WebP 回退');"""
          test=test[:start]+replacement+test[end:]
          testfile.write_text(test,encoding='utf-8')
          htmlfile=root/'genealogy.html'
          html=htmlfile.read_text(encoding='utf-8')
          previous='genealogy_sample_portraits.js?v=20261011-portrait-single-r1'
          assert html.count(previous)==1,'Unexpected script version'
          htmlfile.write_text(html.replace(previous,'genealogy_sample_portraits.js?v=20261011-portrait-files-r1'),encoding='utf-8')
          Path('.github/workflows/convert-genealogy-png.yml').unlink()
          print('Extracted 30 original embedded PNGs; retained 30 existing PNGs')
          PY
          node --check L1nG/GenealogyExporter/genealogy_sample_portraits.js
          node --test tests/default_portrait_integrity.test.cjs
          git diff --check
      - name: Commit verified conversion to working branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- L1nG/GenealogyExporter/assets/sample-portraits L1nG/GenealogyExporter/genealogy_sample_portraits.js L1nG/GenealogyExporter/genealogy.html tests/default_portrait_integrity.test.cjs .github/workflows/convert-genealogy-png.yml
          git commit -m "Store all default genealogy portraits as standalone lossless PNG files"
          git push origin HEAD:genealogy-structural-optimization-20260926
