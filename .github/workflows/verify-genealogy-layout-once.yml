name: Verify genealogy layout refactor
on:
  push:
    branches: [genealogy-structural-optimization-20260926]
    paths: [.github/workflows/verify-genealogy-layout-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run genealogy regression checks
        run: |
          node --check L1nG/GenealogyExporter/genealogy_scene.js
          node --test tests/genealogy_parent_axis_alignment.test.cjs tests/genealogy_coparent_layout.test.cjs tests/default_portrait_integrity.test.cjs
          git diff --check
      - name: Remove one-time workflow after successful verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/verify-genealogy-layout-once.yml
          git add .github/workflows/verify-genealogy-layout-once.yml
          git commit -m "Remove one-time genealogy layout verification workflow"
          git push origin HEAD:genealogy-structural-optimization-20260926
