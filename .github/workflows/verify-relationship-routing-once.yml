name: Verify genealogy relationship routing round two
on:
  push:
    branches: [genealogy-structural-optimization-20260926]
    paths: [.github/workflows/verify-relationship-routing-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and relationship regression tests
        run: |
          node --check L1nG/GenealogyExporter/genealogy_scene.js
          node --check L1nG/GenealogyExporter/genealogy_app.js
          node --test tests/genealogy_relationship_routing_round2.test.cjs tests/genealogy_coparent_layout.test.cjs tests/genealogy_parent_axis_alignment.test.cjs tests/genealogy_family_kinship.test.cjs tests/default_portrait_integrity.test.cjs
          git diff --check
      - name: Clean up one-time verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/verify-relationship-routing-once.yml
          git add .github/workflows/verify-relationship-routing-once.yml
          git commit -m "Remove temporary genealogy relationship routing verifier"
          git push origin HEAD:genealogy-structural-optimization-20260926
