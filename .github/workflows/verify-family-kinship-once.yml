name: Verify family kinship refactor
on:
  push:
    branches: [genealogy-structural-optimization-20260926]
    paths: [.github/workflows/verify-family-kinship-once.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript and regression tests
        run: |
          for file in L1nG/GenealogyExporter/genealogy_kinship.js L1nG/GenealogyExporter/genealogy_app.js L1nG/GenealogyExporter/genealogy_personEditor.js L1nG/GenealogyExporter/genealogy_scene.js L1nG/GenealogyExporter/genealogy_i18n.js; do node --check "$file"; done
          node --test tests/genealogy_family_kinship.test.cjs tests/genealogy_coparent_layout.test.cjs tests/genealogy_parent_axis_alignment.test.cjs tests/default_portrait_integrity.test.cjs
          git diff --check
      - name: Remove verification workflow after success
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/verify-family-kinship-once.yml
          git add .github/workflows/verify-family-kinship-once.yml
          git commit -m "Remove one-time kinship verification workflow"
          git push origin HEAD:genealogy-structural-optimization-20260926
