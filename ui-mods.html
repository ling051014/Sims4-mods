<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LING'S SIMS 4 MODS - UI美化</title>
    <link rel="stylesheet" href="style.css?v=20261022-catalog-runtime-r1">
    <link rel="stylesheet" href="site-skeleton.css?v=20261020-content-load">
</head>
<body class="mod-list-page">
    <script src="site-skeleton.js?v=20261020-content-load" data-skeleton-layout="mods-list"></script>

    <nav class="nav-menu">
        <div class="nav-links">
            <a href="index.html">首頁</a> <span style="color: #eee;">/</span> <a href="#" style="color: #000;">UI美化</a>
        </div>

        <div class="search-box">
            <input type="text" id="mod-search" placeholder="關鍵字搜尋..." onkeyup="searchMods()">
            <div id="search-results" class="search-dropdown"></div>
        </div>
    </nav>

    <main class="page-scroll">
    
        <div class="mod-sort-bar">
  <label for="mod-sort">排序</label>
  <select id="mod-sort" aria-label="模組排序">
    <option value="original">原本順序</option>
    <option value="author-asc">作者 A–Z</option>
    <option value="author-desc">作者 Z–A</option>
  </select>
</div>
        <div class="mod-container">
    
            <div class="mod-card-region" data-catalog-category="ui-mods"></div>
    
        </div>

    </main>

    <dialog id="dlc-dialog" class="dlc-modal">
        <div class="modal-header">
            <span>🔍地圖中英文對照查詢</span>
            <button onclick="document.getElementById('dlc-dialog').close()" class="close-btn">×</button>
        </div>
        <div id="modal-content-placeholder" class="modal-body"></div>
    </dialog>

    <div id="mod-tooltip"></div>
    <script src="script.js?v=20261022-catalog-runtime-r1"></script>
    <script src="dlc-table.js"></script>

    <script src="mod-sort.js?v=20261020-author-sort"></script>
    <script src="mod-catalog.js?v=20261022-json-runtime-r1"></script>
</body>
</html>
